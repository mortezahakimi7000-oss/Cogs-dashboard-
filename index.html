<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COGS Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--accent:#f28c28;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
header{background:#20252b;color:#fff;padding:28px 20px}header .wrap,main{max-width:1050px;margin:auto}
h1{margin:0;font-size:28px}header p{margin:7px 0 0;color:#cbd0d6}
main{padding:24px 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
input,select,button{font:inherit}input,select{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:white}
#search{flex:1;min-width:220px}button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.cardhead{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#fafafa}tr:last-child td{border-bottom:0}
.price{font-weight:800}.updated{color:var(--muted);font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted)}
#admin{display:none}.row{display:grid;grid-template-columns:1.2fr .8fr .8fr .7fr 1fr auto;gap:8px;margin-bottom:8px}
.notice{padding:12px 14px;background:#fff8ef;border:1px solid #f5d4ad;border-radius:10px;color:#6b4a22;margin-bottom:18px;font-size:13px}
@media(max-width:720px){.row{grid-template-columns:1fr 1fr}.row input:last-of-type{grid-column:span 2}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<header><div class="wrap"><h1>COGS Dashboard</h1><p>Live product cost reference</p></div></header>
<main>
<div class="toolbar">
<input id="search" placeholder="Search product or grade…">
<button class="secondary" onclick="refresh()">Refresh</button>
<button class="secondary" onclick="adminLogin()">Admin</button>
</div>
<div id="status" class="notice">Loading current COGS…</div>
<div id="list"></div>

<section id="admin" class="card">
<div class="cardhead"><span>Admin — Update COGS</span><button onclick="addRow()">+ Add product</button></div>
<div style="padding:16px">
<div id="rows"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveAll()">Save changes</button><button class="secondary" onclick="document.getElementById('admin').style.display='none'">Close</button></div>
</div>
</section>
</main>
<script>
https://script.google.com/macros/s/AKfycby4yJrnubxdpRdQT4rCAmVYY1skAOu-5cqVwemA8BTPDwZcGadKD3tgMAFp1iUX0ILNvA/exec
let data=[];
const fmt = x => Number(x).toLocaleString(undefined,{maximumFractionDigits:2});
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const filtered=data.filter(x=>(x.product+" "+x.grade+" "+x.unit).toLowerCase().includes(q));
 const groups={}; filtered.forEach(x=>(groups[x.product]??=[]).push(x));
 const box=document.getElementById('list'); box.innerHTML='';
 if(!filtered.length){box.innerHTML='<div class="card empty">No products found.</div>';return}
 for(const [product,items] of Object.entries(groups)){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="cardhead"><span>${esc(product)}</span><span class="updated">${items.length} item${items.length>1?'s':''}</span></div>
  <table><thead><tr><th>Grade / Size</th><th>COGS</th><th>Currency</th><th>Unit</th><th>Updated</th></tr></thead><tbody>
  ${items.map(x=>`<tr><td>${esc(x.grade)}</td><td class="price">${fmt(x.cogs)}</td><td>${esc(x.currency)}</td><td>${esc(x.unit)}</td><td class="updated">${esc(x.updated||'')}</td></tr>`).join('')}
  </tbody></table>`;box.appendChild(c);
 }
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function refresh(){
 try{
  if(API_URL.includes('PASTE_')) throw Error('API not configured');
  const r = await fetch(API_URL);
const result = await r.json();
const rows = result.data || [];

data = rows.slice(1).map(row => ({
product: row[0],
grade: row[2],
unit: row[3],
cogs: Number(row[4]) || 0,
currency: row[5],
updated: row[6]
}));
 }catch(e){
  data=JSON.parse(localStorage.getItem('cogsData')||'[]');
  document.getElementById('status').textContent=data.length?'Demo/local data loaded. Connect the Google Apps Script URL for shared live data.':'Add your Google Apps Script URL to enable shared live updates.';
 }
 render();
}
function adminLogin(){
 const p=prompt('Admin password:');
 if(p===localStorage.getItem('adminPassword') || p==='admin'){
  document.getElementById('admin').style.display='block'; renderAdmin();
 } else alert('Incorrect password.');
}
function renderAdmin(){
 document.getElementById('rows').innerHTML=data.map((x,i)=>rowHtml(x,i)).join('');
}
function rowHtml(x,i){return `<div class="row" data-i="${i}">
<input value="${esc(x.product)}" placeholder="Product"><input value="${esc(x.grade)}" placeholder="Grade / size">
<input type="number" step="0.01" value="${x.cogs}" placeholder="COGS"><input value="${esc(x.currency)}" placeholder="USD">
<input value="${esc(x.unit)}" placeholder="MT / kg / piece"><button class="secondary" onclick="removeRow(${i})">Delete</button></div>`}
function addRow(){data.push({product:'',grade:'',cogs:0,currency:'USD',unit:'MT',updated:''});renderAdmin()}
function removeRow(i){data.splice(i,1);renderAdmin()}
async function saveAll(){
 const rows=[...document.querySelectorAll('.row')];
 data=rows.map(r=>{const a=r.querySelectorAll('input');return {product:a[0].value,grade:a[1].value,cogs:Number(a[2].value),currency:a[3].value,unit:a[4].value,updated:new Date().toLocaleDateString()}}).filter(x=>x.product&&x.grade);
 localStorage.setItem('cogsData',JSON.stringify(data)); render();
 if(!API_URL.includes('PASTE_')){
   await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
   document.getElementById('status').textContent='Saved to shared live data.';
 } else document.getElementById('status').textContent='Saved locally. Configure the shared API URL to sync colleagues.';
 alert('Saved.');
}
document.getElementById('search').addEventListener('input',render);
refresh();
</script>
</body></html>
